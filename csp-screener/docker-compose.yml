# NAS deployment: nginx serves public/; the screener runs as a one-shot job.
#   First time:  docker compose run --rm screener && docker compose up -d web
#   Each run:    docker compose run --rm screener        (schedule this; see README)
services:
  web:
    container_name: stocks_web
    image: nginx:alpine
    ports: ["9700:80"]                      # point the Cloudflare tunnel here
    volumes: ["./public:/usr/share/nginx/html:ro"]   # only public/ is exposed, never .env or data/
    restart: unless-stopped
    networks:
      - internal                          # KEEP: pinned subnet, outbound internet (Telegram etc.)
      - cloudflare-web                    # KEEP: lets cloudflared reach the CRM

  screener:
    container_name: stocks_screener
    image: python:3.12-slim
    working_dir: /app
    volumes: ["./:/app"]
    env_file: .env                          # TRADIER_TOKEN etc. stay on the NAS
    environment: { TZ: America/Los_Angeles }
    command: sh -c "pip install -q --disable-pip-version-check tzdata && python screener.py"
    profiles: ["job"]                       # not started by `docker compose up`

networks:
  internal:
    driver: bridge                        # KEEP: avoids host mode on Synology
    # Do NOT add "internal: true" here, it would block outbound internet.
    ipam:
      config:
        - subnet: 172.32.0.0/24           # confirm this doesn't overlap another Docker network
  cloudflare-web:
    external: true                        # created by the cloudflared stack, so start that first
