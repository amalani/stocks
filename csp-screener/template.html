<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CSP Screener</title>
<link rel="manifest" href="/*__ROOTPATH__*/manifest.webmanifest">
<link rel="apple-touch-icon" href="/*__ROOTPATH__*/apple-touch-icon.png">
<meta name="theme-color" content="#14161a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CSP">
<script>try{var t=localStorage.getItem('theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
<style>
:root{
  --bg:#f6f6f3; --panel:#ffffff; --ink:#1c2024; --mute:#6a717b; --line:#e3e4e0; --hover:#f0f1ed; --sel:#e8eefc;
  --good:#136c43; --goodbg:#e3f3ea; --warn:#8a5a00; --warnbg:#fff1cf; --bad:#a82a1f; --badbg:#fbe7e4;
  --c0:#2457d6; --c1:#c2570c;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme]){
    --bg:#14161a; --panel:#1b1e23; --ink:#e7e9ec; --mute:#98a0ab; --line:#2b3037; --hover:#222630; --sel:#1f2b45;
    --good:#58c58b; --goodbg:#16301f; --warn:#e5b04a; --warnbg:#35290e; --bad:#f08a80; --badbg:#3a1d1a;
    --c0:#6e9bff; --c1:#f0914e;
    color-scheme:dark;
  }
}
:root[data-theme=dark]{
    --bg:#14161a; --panel:#1b1e23; --ink:#e7e9ec; --mute:#98a0ab; --line:#2b3037; --hover:#222630; --sel:#1f2b45;
    --good:#58c58b; --goodbg:#16301f; --warn:#e5b04a; --warnbg:#35290e; --bad:#f08a80; --badbg:#3a1d1a;
    --c0:#6e9bff; --c1:#f0914e;
    color-scheme:dark;
}
:root[data-theme=light]{color-scheme:light}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.tools{display:flex;gap:10px;align-items:flex-start}
.helpbtn{margin-top:4px;padding:4px 10px;font-size:12px;font-weight:600}
a.helpbtn{background:var(--panel);color:var(--mute);border:1px solid var(--line);border-radius:6px}
a.helpbtn:hover{background:var(--hover);color:var(--ink)}
.foot{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-top:24px}
#csv{line-height:0;padding:6px 8px;color:var(--mute)}
.theme{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.theme button{border:0;border-radius:0;padding:5px 8px;line-height:0;color:var(--mute)}
.theme button+button{border-left:1px solid var(--line)}
.theme button.on{background:var(--sel);color:var(--ink)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:1280px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:20px;margin:0 0 2px}
h3{font-size:13px;margin:0 0 6px;font-weight:600}
.mute{color:var(--mute)}
.meta{color:var(--mute);font-size:13px;margin-bottom:14px}
.navrow{display:flex;align-items:center;justify-content:space-between;gap:8px 16px;flex-wrap:wrap;margin:0 0 14px}
.navrow .tabs{margin:0}
.nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 0 auto}
.nav button:disabled{opacity:.4;cursor:default;background:var(--panel)}
.nav select{min-width:15ch;text-align:center;text-align-last:center;font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
.nav a{color:var(--c0);font-size:13px}
@media print{.nav{display:none}}
.notices{margin:0 0 12px;font-size:13px;color:var(--mute)}
.notices summary{cursor:pointer;padding:2px 0}
.notices .note{background:var(--warnbg);color:var(--warn);padding:6px 12px;border-radius:6px;margin-top:6px}
.banner{background:var(--warnbg);color:var(--warn);padding:8px 12px;border-radius:6px;margin-bottom:12px;font-size:13px}
.tvgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.tvbox{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden;min-height:60px}
.tvbox h3{margin:0;padding:8px 12px 0;font-size:13px}
.tvnote{color:var(--mute);font-size:12px;margin:8px 0 14px}
.tvgrid[hidden],.bar[hidden],#top3[hidden],#legend[hidden]{display:none}
.bar{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:end;margin-bottom:12px}
.bar label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mute)}
.bar label.chk{flex-direction:row;align-items:center;gap:6px;color:var(--ink);font-size:13px;padding-bottom:6px}
input[type=text],input[type=number],select{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:inherit;width:110px}
.bar select{width:auto}
.spacer{flex:1}
button{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 10px;font:inherit;cursor:pointer}
button:hover{background:var(--hover)}
.tablewrap{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:7px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
.tablewrap.main{overflow:auto;max-height:calc(100vh - 90px)}
th.l,td.l{text-align:left}
th{font-size:12px;font-weight:600;color:var(--mute);cursor:pointer;user-select:none;position:sticky;top:0;background:var(--panel)}
th.nosort{cursor:default}
th .ar{display:inline-block;width:10px}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--hover)}
tbody tr.sel{background:var(--sel)}
tbody tr:last-child td{border-bottom:0}
td.strong{font-weight:600}
td.good{color:var(--good);font-weight:600}
td.warn{color:var(--warn)}
td.bad{color:var(--bad)}
.dot{color:var(--good)}
.tag{display:inline-block;padding:1px 6px;border-radius:4px;font-size:12px}
.tag.bad{background:var(--badbg);color:var(--bad)}
.tag.cust{background:var(--sel);color:var(--ink);font-size:11px;padding:0 5px}

/* strike ladder in the details panel */
.ladder{margin-top:16px}
.ladder table{font-size:12.5px}
.ladder th{position:static;cursor:default;padding:5px 9px}
.ladder td{padding:5px 9px}
.ladder tr{cursor:default}
.ladder tr:hover{background:none}
.ladder tr.pick td{font-weight:600;background:var(--sel)}
.ladder tr.over td{color:var(--mute)}
.ladder tr.edge td{border-top:2px solid var(--line)}
.ladder .lt{font-size:11px;font-weight:600;color:var(--c0);margin-left:6px}
.empty{padding:28px;text-align:center;color:var(--mute)}

/* shortlist grouping: ● rows first, the rest dimmed */
tbody tr.dim td{opacity:.58}
tbody tr.dim:hover td,tbody tr.dim.sel td{opacity:1}
tbody tr.grp{cursor:default}
tbody tr.grp:hover{background:none}
tr.grp td{background:var(--bg);color:var(--mute);font-size:12px;font-weight:600;text-align:left;padding:6px 10px}

/* the cells that decide ●: shown on hover / selection */
td[data-chk]::after{display:inline-block;width:1em;margin-left:4px;text-align:left;visibility:hidden}
td[data-chk=ok]::after{content:"✓"}
td[data-chk=no]::after{content:"✗"}
td[data-chk=na]::after{content:""}
tbody tr:hover td[data-chk]::after,tbody tr.sel td[data-chk]::after{visibility:visible}
tbody tr:hover td[data-chk=ok],tbody tr.sel td[data-chk=ok]{background:var(--goodbg);box-shadow:inset 0 -2px 0 var(--good)}
tbody tr:hover td[data-chk=no],tbody tr.sel td[data-chk=no]{background:var(--badbg);box-shadow:inset 0 -2px 0 var(--bad)}
tbody tr:hover td[data-chk=na],tbody tr.sel td[data-chk=na]{background:var(--warnbg);box-shadow:inset 0 -2px 0 var(--warn)}

/* details panel: pinned to the bottom of the window so the table stays visible above it */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-top:16px;
  position:sticky;bottom:10px;z-index:5;max-height:58vh;overflow:auto;box-shadow:0 8px 28px rgba(0,0,0,.18)}
.panel .head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.panel .head button{padding:2px 8px}
.dgrid{display:grid;grid-template-columns:minmax(250px,330px) 1fr;gap:20px}
@media (max-width:860px){.dgrid{grid-template-columns:1fr}}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
.checks{list-style:none;margin:0;padding:0;display:grid;gap:9px}
.checks li{display:grid;grid-template-columns:20px 1fr;gap:6px;font-size:13px}
.checks .ic{font-weight:700}
.checks .d{display:block;color:var(--mute);font-size:12px}
.s-ok{color:var(--good)} .s-no{color:var(--bad)} .s-na{color:var(--warn)}
.take{margin-top:12px;font-size:12px;color:var(--mute);line-height:1.55}
.take b{color:var(--ink);font-weight:600}
svg text{font:11px system-ui,sans-serif;fill:var(--mute)}
svg .grid{stroke:var(--line);stroke-width:1}
svg .ln{fill:none;stroke-width:2;stroke-linejoin:round}
/* top opportunities strip */
.tabs{max-width:100%;overflow-x:auto;display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin:0 0 14px}
.tabs button{border:0;border-radius:0;padding:7px 14px;font-weight:600;color:var(--mute)}
.tabs button+button{border-left:1px solid var(--line)}
.tabs button.on{background:var(--sel);color:var(--ink)}
.top3{margin:0 0 16px}
.top3 h2{font-size:13px;margin:0 0 8px;font-weight:600}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:10px}
.card{display:block;width:100%;text-align:left;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel)}
.card:hover{border-color:var(--good);background:var(--panel)}
.card.sel{border-color:var(--c0);background:var(--sel)}
.card .t{display:flex;justify-content:space-between;align-items:baseline}
.card .roc{font-size:20px;font-weight:700;color:var(--good)}
.card .roc small{font-size:11px;font-weight:400;color:var(--mute)}
.card .m{font-size:12px;color:var(--mute);margin-top:4px;line-height:1.5}
.card .m b{color:var(--ink);font-weight:600}
.reason{font-size:13px;font-weight:600;margin:-2px 0 12px}
.legend{margin-top:18px;font-size:12px;color:var(--mute);line-height:1.6}
.legend b{color:var(--ink);font-weight:600}
details{margin-top:12px;font-size:13px}

/* help drawer */
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:30}
#help{position:fixed;top:0;right:0;bottom:0;width:min(460px,100vw);background:var(--panel);border-left:1px solid var(--line);
  z-index:31;overflow:auto;padding:18px 22px 40px;box-shadow:-10px 0 30px rgba(0,0,0,.2)}
#help .row{display:flex;justify-content:space-between;align-items:center}
#help h2{font-size:16px;margin:0}
#help h4{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);margin:22px 0 8px}
#help ol{padding-left:20px;margin:0;display:grid;gap:9px}
#help dl{margin:0}
#help dt{font-weight:600;margin-top:12px}
#help dd{margin:2px 0 0;color:var(--mute);font-size:13px}
#help p{margin:6px 0;color:var(--mute);font-size:13px}
</style>
</head>
<body>
<main>
  <div class="top"><h1>CSP Screener</h1>
    <div class="tools">
      <a class="helpbtn" href="https://www.google.com/finance/#lists" target="_blank" rel="noopener" title="Your Google Finance lists" style="text-decoration:none;display:inline-block">GF ↗</a>
      <button id="helpbtn" class="helpbtn" title="Press ? at any time">? How to read this</button>
    </div></div>
  <div class="meta" id="meta"></div>
  <div id="banners"></div>
  <div class="navrow"><div class="tabs" id="tabs"><button data-lens="income" class="on">Income · by delta</button><button data-lens="wheel" id="tab-wheel">Wheel · own price</button><button data-lens="cc" id="tab-cc">Covered calls · cost basis</button><button data-lens="prices">Prices</button><button data-lens="charts">Charts</button><button data-lens="market">Market</button></div>
  <div class="nav" id="nav" hidden></div></div>
  <div class="top3" id="top3"></div>

  <div class="bar">
    <label>Ticker<select id="f-q"><option value="">All</option></select></label>
    <label>Expiry<select id="f-exp"><option value="">All</option></select></label>
    <label>Rows per ticker<select id="f-per">
      <option value="">All expiries</option>
      <option value="roc">Best ROC</option>
      <option value="dte">Nearest 14 DTE</option></select></label>
    <label>Min ann. ROC %<input type="number" id="f-roc" min="0" step="1" placeholder="0"></label>
    <label>Min IV Rank<input type="number" id="f-ivr" min="0" max="100" step="5" placeholder="0"></label>
    <label class="chk"><input type="checkbox" id="f-pass"> Passing only</label>
    <label class="chk"><input type="checkbox" id="f-earn"> Hide earnings in window</label>
    <label class="chk"><input type="checkbox" id="f-liq"> Liquid only</label>
    <span class="spacer"></span>
    <span class="mute" id="count"></span>
  </div>

  <div class="tablewrap main"><table id="tbl"><thead></thead><tbody></tbody></table></div>

  <div id="live" hidden></div>
  <div class="tablewrap" id="prices" hidden></div>
  <div id="charts" hidden></div>
  <div id="market" hidden></div>

  <div class="panel" id="hist" hidden></div>

  <div class="legend" id="legend"></div>
  <details id="errs" hidden><summary class="mute">Skipped / errors</summary><ul id="errlist"></ul></details>
  <div class="foot"><div class="theme" id="theme"><button data-t="light" title="Light" aria-label="Light"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button><button data-t="system" title="System" aria-label="System"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg></button><button data-t="dark" title="Dark" aria-label="Dark"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button></div><button id="csv" title="Download CSV" aria-label="Download CSV"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg></button></div>
</main>

<div id="scrim" hidden></div>
<aside id="help" role="dialog" aria-label="How to read this page" hidden></aside>

<script>
const DATA = /*__DATA__*/null;
const ROOT = /*__ROOT__*/"";   // path from this page to the output dir ("" for index.html, "../" for runs/*.html)
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register(ROOT + 'sw.js').catch(() => {});
const D = DATA, C = D.config;
const PREF_DTE = 14;
const $ = s => document.querySelector(s);
(function(){
  const root = document.documentElement;
  const cur = () => root.dataset.theme || 'system';
  const mark = () => document.querySelectorAll('#theme button').forEach(b => b.classList.toggle('on', b.dataset.t === cur()));
  document.querySelectorAll('#theme button').forEach(b => b.onclick = () => {
    const t = b.dataset.t;
    if (t === 'system') delete root.dataset.theme; else root.dataset.theme = t;
    try { t === 'system' ? localStorage.removeItem('theme') : localStorage.setItem('theme', t); } catch (e) {}
    mark();
    if (window.tvTheme) setTimeout(tvTheme, 0);
  });
  mark();
})();
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num = (v, d = 2) => v == null ? '–' : Number(v).toFixed(d);
const pct = (v, d = 1) => v == null ? '–' : Number(v).toFixed(d) + '%';

// ---- columns ----------------------------------------------------------
// chk(r) -> 'ok' | 'no' | 'na' | null marks the cells that decide the ● (highlighted on hover/selection).
const incomeCols = [
  {k:'passes', label:'●', tip:'Worth a look: liquid, IV elevated, pays at least the ROC hurdle, no earnings before expiry. Hover a row\'s ● for its reason. Click to group these first.',
    ttip:r => reason(r), html:r => r.passes ? '<span class="dot">●</span>' : ''},
  {k:'symbol', label:'Ticker', left:true, html:r => `<b>${esc(r.symbol)}</b>` + (custom(r) ? ` <span class="tag cust" title="Custom target delta from watchlist.txt">≤${num(tgt(r))}Δ</span>` : '')},
  {k:'spot', label:'Spot', html:r => num(r.spot)},
  {k:'expiry', label:'Expiry', html:r => `${r.expiry.slice(5)} <span class="mute">${r.dte}d</span>`},
  {k:'strike', label:'Strike', html:r => num(r.strike, r.strike % 1 ? 2 : 0)},
  {k:'delta', label:'Δ', tip:'Put delta (shown positive): a rough assignment probability', html:r => num(r.delta)},
  {k:'mid', label:'Mid', html:r => num(r.mid)},
  {k:'roc', label:'Ann. ROC', tip:'mid / strike × 365 / DTE. Compared with your ROC hurdle.', cls:() => 'strong',
    chk:r => r.pays == null ? null : (r.pays ? 'ok' : 'no'), html:r => pct(r.roc)},
  {k:'cushion_pct', label:'Cushion', tip:'(spot − strike) / spot', html:r => pct(r.cushion_pct)},
  {k:'em_mult', label:'vs EM', tip:'Cushion in units of the 1σ expected move (ATM IV). Around 0.8-0.9× is normal at 0.20Δ; ≥ 1× is further out; below 0.75× is close.',
    cls:r => r.em_mult == null ? '' : r.em_mult >= 1 ? 'good' : r.em_mult < 0.75 ? 'warn' : '', html:r => r.em_mult == null ? '–' : num(r.em_mult) + '×'},
  {k:'ref_iv', label:'ATM IV', tip:'ATM implied vol of the expiry nearest 21 DTE', html:r => r.ref_iv == null ? '–' : pct(r.ref_iv * 100, 0)},
  {k:'ivr', label:'IV Rank', tip:r => r.ivr == null ? `${r.ivr_n} of ${C.min_history} days of history needed` : `rank over ${r.ivr_n} days`,
    chk:r => r.ivr == null ? null : (r.ivr >= C.ivr_min ? 'ok' : 'no'),
    cls:r => r.ivr != null && r.ivr >= C.ivr_min ? 'good' : '', html:r => r.ivr == null ? '<span class="mute">–</span>' : num(r.ivr, 0)},
  {k:'iv_rv', label:'IV/RV', tip:'ATM IV ÷ 30-day realized vol',
    chk:r => r.ivr != null ? null : (r.iv_rv != null && r.iv_rv >= C.ivrv_min ? 'ok' : 'no'),
    cls:r => r.iv_rv != null && r.iv_rv >= C.ivrv_min ? 'good' : '', html:r => num(r.iv_rv)},
  {k:'spread_pct', label:'Spread', tip:'bid-ask as % of mid',
    chk:r => r.spread_pct != null && r.spread_pct <= C.max_spread ? 'ok' : 'no',
    cls:r => r.spread_pct == null || r.spread_pct > C.max_spread ? 'bad' : '', html:r => pct(r.spread_pct, 1)},
  {k:'oi', label:'OI', tip:'Open interest', chk:r => r.oi >= C.min_oi ? 'ok' : 'no',
    cls:r => r.oi < C.min_oi ? 'bad' : '', html:r => r.oi.toLocaleString()},
  {k:'earnings', label:'Earnings', tip:'Earnings date on/before expiry',
    chk:r => r.earnings ? 'no' : (r.earn_known ? 'ok' : 'na'),
    html:r => r.earnings ? `<span class="tag bad">${r.earnings.slice(5)}</span>` : (r.earn_known ? '<span class="mute">–</span>' : '<span class="mute" title="No earnings source configured">?</span>')},
  {k:'spark', label:'IV trend', nosort:true, html:r => spark(r.symbol)},
];

// ---- state ------------------------------------------------------------
let sort = {k:'passes', dir:-1};   // shortlist first, then by ROC
let selected = null;               // "SYMBOL|expiry"
const keyOf = r => r.symbol + '|' + r.expiry;

// Two lenses over the same run: "income" (fixed delta per ticker) and "wheel" (strike at your own price).
let lens = 'income';
const src = () => lens === 'wheel' ? (D.wheel || []) : lens === 'cc' ? (D.cc || []) : D.rows;
const col = k => incomeCols.find(c => c.k === k);
const wheelCols = [
  {k:'passes', label:'●', tip:'Worth a look for the wheel: liquid, pays at least the ROC hurdle, no earnings before expiry. Hover a row\'s ● for its reason. Click to group these first.',
    ttip:r => reason(r), html:r => r.passes ? '<span class="dot">●</span>' : ''},
  col('symbol'), col('spot'),
  {k:'own_price', label:'Own price', tip:'The price you would be happy to own it at (from your sheet or watchlist)', html:r => '$' + num(r.own_price, r.own_price % 1 ? 2 : 0)},
  {k:'spot_vs_own', label:'Spot vs own', tip:'Today\'s price relative to your own price. Red means the stock is at or below the price you set, so that price may be stale and the strike now follows spot.',
    cls:r => r.spot_vs_own != null && r.spot_vs_own <= 0 ? 'bad' : '',
    html:r => r.spot_vs_own == null ? '–' : (r.spot_vs_own <= 0 ? '<span class="tag bad">below</span> ' : '') + pct(r.spot_vs_own)},
  col('expiry'), col('strike'),

function priceRows() {
  const spot = {};
  [D.rows, D.wheel || [], D.cc || []].forEach(a => a.forEach(r => { if (r.spot != null) spot[r.symbol] = r.spot; }));
  const sess = D.session || D.generated.slice(0, 10);
  const syms = new Set([...Object.keys(spot), ...Object.keys(D.history || {})]);
  return [...syms].sort().map(sym => {
    const h = (D.history[sym] || []).filter(p => p.spot != null).map(p => ({d: p.d, v: p.spot}));
    if (spot[sym] != null) { if (h.length && h[h.length - 1].d === sess) h[h.length - 1].v = spot[sym]; else h.push({d: sess, v: spot[sym]}); }
    const last = h.length ? h[h.length - 1].v : null;
    const prev = h.length > 1 ? h[h.length - 2].v : null, first = h.length > 1 ? h[0].v : null;
    const vs = h.map(p => p.v);
    return {sym, h, last, day: prev ? (last / prev - 1) * 100 : null, since: first ? (last / first - 1) * 100 : null,
            lo: vs.length ? Math.min(...vs) : null, hi: vs.length ? Math.max(...vs) : null, from: h.length ? h[0].d : null};
  });
}
function priceSpark(h) {

const cmpArr = (a, b) => { for (let i = 0; i < a.length; i++) if (a[i] !== b[i]) return a[i] > b[i] ? 1 : -1; return 0; };

function filtered() {
  const q = $('#f-q').value.trim().toUpperCase(), exp = $('#f-exp').value;
  const roc = parseFloat($('#f-roc').value) || 0, ivr = parseFloat($('#f-ivr').value) || 0;
  const rows = src().filter(r =>
    (!q || r.symbol === q) && (!exp || r.expiry === exp) && r.roc >= roc &&
    (!ivr || (r.ivr != null && r.ivr >= ivr)) &&
    (!$('#f-pass').checked || r.passes) && (!$('#f-earn').checked || !r.earnings) &&
    (!$('#f-liq').checked || r.liquid));
  const per = $('#f-per').value;
  if (!per) return rows;
  // One row per ticker: shortlist rows win, then best ROC (or the expiry nearest 14 DTE).
  const score = r => per === 'roc' ? [r.passes ? 1 : 0, r.roc] : [r.passes ? 1 : 0, -Math.abs(r.dte - PREF_DTE), r.roc];
  const best = new Map();
  rows.forEach(r => { const b = best.get(r.symbol); if (!b || cmpArr(score(r), score(b)) > 0) best.set(r.symbol, r); });
  return [...best.values()];
}

function rowHTML(r, anyPass) {
  const cls = [selected === keyOf(r) ? 'sel' : '', anyPass && !r.passes ? 'dim' : ''].join(' ');
  return `<tr data-key="${esc(keyOf(r))}" class="${cls}">` + cols.map(c => {
    const klass = [c.left ? 'l' : '', c.cls ? c.cls(r) : ''].join(' ');
    const tip = c.ttip ? c.ttip(r) : (typeof c.tip === 'function' ? c.tip(r) : '');
    const chk = c.chk ? c.chk(r) : null;
    return `<td class="${klass}"${chk ? ` data-chk="${chk}"` : ''}${tip ? ` title="${esc(tip)}"` : ''}>${c.html(r)}</td>`;
  }).join('') + '</tr>';
}

// Best ● expiry per ticker (nearest ~2 weeks, so very short expiries do not win on inflated annualized ROC).
function topPicks() {
  const best = new Map(), s = x => [-Math.abs(x.dte - PREF_DTE), x.roc];
  src().filter(r => r.passes).forEach(r => { const b = best.get(r.symbol); if (!b || cmpArr(s(r), s(b)) > 0) best.set(r.symbol, r); });
  return [...best.values()].sort((a, b) => b.roc - a.roc).slice(0, 6);
}
const WHEEL_HOWTO = 'Add an own price to a ticker (an "Own price" column in your sheet, or <code>AMD @480</code> in watchlist.txt) to see wheel setups here.';
const CC_HOWTO = 'Add a cost basis to a ticker (a "Cost basis" column in your sheet, or <code>AMD $465</code> in watchlist.txt) to see covered calls on shares you hold.';
const howto = () => lens === 'wheel' ? WHEEL_HOWTO : lens === 'cc' ? CC_HOWTO : '';
function renderTop() {

        Own at <b>$${num(r.net_cost)}</b> net · ${pct(r.net_below_spot_pct)} below spot<br>

        $${r.premium.toFixed(0)} on $${r.collateral.toLocaleString()} · ${pct(r.cushion_pct)} cushion<br>

function render() {
  renderTop();
  const rows = filtered().sort((a, b) => {
    const av = a[sort.k], bv = b[sort.k];
    if (av == null && bv == null) return 0;
    if (av == null) return 1;
    if (bv == null) return -1;
    return (av > bv ? 1 : av < bv ? -1 : 0) * sort.dir || (b.roc - a.roc);
  });
  const nPass = rows.filter(r => r.passes).length, anyPass = nPass > 0;
  const grouped = sort.k === 'passes' && sort.dir < 0 && anyPass;
  $('#tbl thead').innerHTML = '<tr>' + cols.map(c =>
    `<th class="${c.left ? 'l' : ''} ${c.nosort ? 'nosort' : ''}" data-k="${c.k}" title="${esc(typeof c.tip === 'string' ? c.tip : '')}">${c.label}<span class="ar">${sort.k === c.k ? (sort.dir > 0 ? '▲' : '▼') : ''}</span></th>`).join('') + '</tr>';
  let html = '', prev = null;
  rows.forEach(r => {
    if (grouped && r.passes !== prev) {

      prev = r.passes;

  });
  $('#tbl tbody').innerHTML = rows.length ? html :

  $('#count').textContent = `${rows.length} row${rows.length === 1 ? '' : 's'} · ${nPass} worth a look`;

// ---- details panel ----------------------------------------------------
function chart(title, series, fmt) {
  const all = series.flatMap(s => s.pts);
  if (all.length < 2) return `<div><h3>${title}</h3><p class="mute">Not enough history yet. It builds one point per weekday the job runs.</p></div>`;
  const W = 440, H = 180, L = 40, R = 64, T = 10, B = 22;
  let x0 = Math.min(...all.map(p => p.t)), x1 = Math.max(...all.map(p => p.t));
  let y0 = Math.min(...all.map(p => p.v)), y1 = Math.max(...all.map(p => p.v));
  const pad = (y1 - y0) * 0.12 || Math.abs(y1) * 0.1 || 1; y0 -= pad; y1 += pad;
  const X = t => L + (t - x0) / ((x1 - x0) || 1) * (W - L - R), Y = v => T + (1 - (v - y0) / (y1 - y0)) * (H - T - B);
  let g = '';
  for (let i = 0; i < 4; i++) {
    const v = y0 + (y1 - y0) * i / 3;
    g += `<line class="grid" x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${L - 6}" y="${Y(v) + 4}" text-anchor="end">${fmt(v)}</text>`;
  }
  const d = t => new Date(t).toISOString().slice(0, 10);
  g += `<text x="${L}" y="${H - 6}">${d(x0)}</text><text x="${W - R}" y="${H - 6}" text-anchor="end">${d(x1)}</text>`;
  let lastY = [];
  series.forEach((s, i) => {
    if (!s.pts.length) return;
    g += `<path class="ln" stroke="var(--c${i})" d="${s.pts.map((p, j) => (j ? 'L' : 'M') + X(p.t).toFixed(1) + ' ' + Y(p.v).toFixed(1)).join('')}"/>`;
    const p = s.pts[s.pts.length - 1];
    let ly = Y(p.v) + 4;
    lastY.forEach(o => { if (Math.abs(ly - o) < 13) ly = o + 13; });
    lastY.push(ly);
    g += `<circle cx="${X(p.t)}" cy="${Y(p.v)}" r="3" fill="var(--c${i})"/><text x="${W - R + 8}" y="${ly}" style="fill:var(--c${i})">${s.name} ${fmt(p.v)}</text>`;
  });
  return `<div><h3>${title}</h3><svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(title)}">${g}</svg></div>`;
}

// One plain-English line on why a row is (or is not) worth a look.
function reason(r) {
  if (r.cost_basis != null) return ccReason(r);
  if (r.own_price != null) return wheelReason(r);
  if (r.earnings) return `Skip: earnings ${r.earnings} before expiry`;
  const liq = r.spread_pct != null && r.spread_pct <= C.max_spread && r.oi >= C.min_oi;
  if (!liq) return `Skip: thin market (spread ${pct(r.spread_pct)}, OI ${r.oi.toLocaleString()})`;
  if (!r.rich) return r.ivr != null ? `Weak: IV not elevated (IV Rank ${num(r.ivr, 0)}, needs ${C.ivr_min})`
                                    : `Weak: IV not elevated (IV is ${num(r.iv_rv)}× realized, needs ${C.ivrv_min}×)`;
  if (r.pays === false) return `Thin: ${pct(r.roc, 0)} annualized is under your ${C.min_roc}% hurdle`;
  const iv = r.ivr != null ? `IV Rank ${num(r.ivr, 0)}` : `IV ${num(r.iv_rv)}× realized`;
  return `Worth a look: pays ${pct(r.roc, 0)} annualized, ${iv}, ${pct(r.cushion_pct)} cushion${r.earn_known ? '' : ' (earnings unchecked)'}`;
}

// Covered call: you hold the shares, so the question is whether the premium is worth the capped upside.
function ccReason(r) {
  if (r.earnings) return `Skip: earnings ${r.earnings} before expiry`;
  if (!(ccTight(r) && r.oi >= C.min_oi)) return `Skip: thin market (spread ${pct(r.spread_pct)}${r.spread != null ? ' / $' + num(r.spread) : ''}, OI ${r.oi.toLocaleString()})`;
  if (r.pays === false) return `Thin: ${pct(r.roc, 0)} annualized is under your ${C.min_cc_yield}% hurdle` +
    (r.floored ? `; your cost basis pushes the strike up to $${num(r.strike, r.strike % 1 ? 2 : 0)}, which is why it pays so little` : '');
  return `Worth a look: collect $${r.premium.toFixed(0)} (${pct(r.roc, 0)} annualized), about ${(r.delta * 100).toFixed(0)}% chance of being called away at $${num(r.strike, r.strike % 1 ? 2 : 0)}, ` +
    `${pct(r.called_pct)} over your cost if it is` + (r.earn_known ? '' : ' (earnings unchecked)');
}

// Wheel: you are happy to own it at your price, so the question is whether the payout and the market are good.
function wheelReason(r) {
  if (r.earnings) return `Skip: earnings ${r.earnings} before expiry`;
  const liq = r.spread_pct != null && r.spread_pct <= C.max_spread && r.oi >= C.min_oi;
  if (!liq) return `Skip: thin market (spread ${pct(r.spread_pct)}, OI ${r.oi.toLocaleString()})`;
  if (r.pays === false) return `Thin: ${pct(r.roc, 0)} annualized is under your ${C.min_roc}% hurdle`;
  return `Worth a look: own it at a net $${num(r.net_cost)} (${pct(r.net_below_spot_pct)} below spot) and get paid ${pct(r.roc, 0)} annualized while you wait` +
    (r.delta != null ? `; about ${(r.delta * 100).toFixed(0)}% assignment odds` : '') + (r.earn_known ? '' : ' (earnings unchecked)');
}

// The tests behind ●, with the actual numbers.
function checklist(r) {
  const cc = r.cost_basis != null;
  const liq = (cc ? ccTight(r) : r.spread_pct != null && r.spread_pct <= C.max_spread) && r.oi >= C.min_oi;
  const wheel = r.own_price != null || r.cost_basis != null;   // IV richness is information only on these tabs
  const items = [
    {s: liq ? 'ok' : 'no', t: 'Liquid',
     d: `spread ${pct(r.spread_pct)}${cc && r.spread != null ? ' / $' + num(r.spread) : ''} (max ${C.max_spread}%${cc && C.cc_max_spread_abs != null ? ' or $' + C.cc_max_spread_abs.toFixed(2) : ''}) · open interest ${r.oi.toLocaleString()} (min ${C.min_oi})`},
    ...(wheel ? [] : [{s: r.rich ? 'ok' : 'no', t: 'IV elevated',
     d: r.ivr != null ? `IV Rank ${num(r.ivr, 0)} (needs ≥ ${C.ivr_min}), over ${r.ivr_n} days of history`
        : `IV/RV ${num(r.iv_rv)} (needs ≥ ${C.ivrv_min}). IV Rank starts after ${C.min_history} days of history (${r.ivr_n} so far)`}]),
    ...(r.pays == null ? [] : [{s: r.pays ? 'ok' : 'no', t: 'Pays enough',
     d: `${pct(r.roc, 0)} annualized (hurdle ${r.cost_basis != null ? C.min_cc_yield : C.min_roc}%)`}]),
    ...(r.cost_basis == null ? [] : [{s: 'ok', t: 'Strike at or above cost basis',
     d: r.floored ? `raised from $${num(r.target_strike)} to $${num(r.strike)}: the ${num(r.target_delta)}Δ strike was under your $${num(r.cost_basis)} cost`
        : `$${num(r.strike)} is above your $${num(r.cost_basis)} cost, so a call-away is a gain`}]),
    {s: r.earnings ? 'no' : (r.earn_known ? 'ok' : 'na'), t: 'No earnings before expiry',
     d: r.earnings ? `earnings ${r.earnings} is before ${r.expiry}` : (r.earn_known ? 'none found' : 'unknown: no earnings source is configured, check it yourself')},
  ];
  const ic = {ok: '✓', no: '✗', na: '?'};
  return `<ul class="checks">${items.map(i =>
    `<li><span class="ic s-${i.s}">${ic[i.s]}</span><span>${i.t}<span class="d">${esc(i.d)}</span></span></li>`).join('')}</ul>`;
}

// Neighbouring strikes at the same expiry: the screened pick vs. going further out / closer in.
function ccLadderHTML(r) {
  const L = r.ladder;
  if (!L || !L.length) return '';
  const t = r.target_delta, isOver = x => x.delta > t + 1e-9 || x.strike < r.cost_basis - 1e-9;
  const rowsHTML = L.map((x, i) => {                              // lowest strike (most premium, most call-away risk) first
    const pick = x.strike === r.strike, over = isOver(x), edge = i > 0 && isOver(L[i - 1]) && !over;
    const loss = x.called_pct < 0;
    return `<tr class="${pick ? 'pick' : ''} ${over ? 'over' : ''} ${edge ? 'edge' : ''}">
      <td class="l">${num(x.strike, x.strike % 1 ? 2 : 0)}${pick ? '<span class="lt">◀ screened pick</span>' : ''}</td>
      <td>${num(x.delta)}</td><td>${num(x.mid)}</td><td>${pct(x.roc)}</td><td>${pct(x.upside_pct)}</td>
      <td class="${loss ? 'bad' : ''}">${pct(x.called_pct)}</td>
      <td>${x.em_mult == null ? '–' : num(x.em_mult) + '×'}</td>
      <td class="${ccTight(x) ? '' : 'bad'}">${pct(x.spread_pct)}</td>
      <td class="${x.oi < C.min_oi ? 'bad' : ''}">${x.oi.toLocaleString()}</td>
      <td>${x.iv == null ? '–' : pct(x.iv * 100, 0)}</td></tr>`;
  }).join('');
  return `<div class="ladder"><h3>Strikes at this expiry <span class="mute" style="font-weight:400">· greyed rows break a rule: above the ${num(t)}Δ target (likelier to be called) or under your $${num(r.cost_basis, r.cost_basis % 1 ? 2 : 0)} cost (called away at a loss)</span></h3>
    <div class="tablewrap"><table><thead><tr><th class="l">Strike</th><th>Δ</th><th>Mid</th><th>Ann. yield</th><th>Room</th><th>If called</th><th>vs EM</th><th>Spread</th><th>OI</th><th>IV</th></tr></thead>
    <tbody>${rowsHTML}</tbody></table></div></div>`;
}

function ladderHTML(r) {
  if (r.cost_basis != null) return ccLadderHTML(r);
  const L = r.ladder;
  if (!L || !L.length) return '';
  const wheel = r.own_price != null, t = tgt(r);
  const isOver = x => wheel ? x.strike > r.own_price + 1e-9 : x.delta > t + 1e-9;   // above your own price / above the target delta
  const rowsHTML = [...L].reverse().map((x, i, arr) => {        // highest strike (highest delta) first
    const pick = x.strike === r.strike, over = isOver(x);
    const edge = i > 0 && isOver(arr[i - 1]) && !over;           // boundary between the greyed and the normal rows
    const bad = x.spread_pct == null || x.spread_pct > C.max_spread || x.oi < C.min_oi;
    return `<tr class="${pick ? 'pick' : ''} ${over ? 'over' : ''} ${edge ? 'edge' : ''}">
      <td class="l">${num(x.strike, x.strike % 1 ? 2 : 0)}${pick ? `<span class="lt">◀ ${wheel ? 'your strike' : 'screened pick'}</span>` : ''}</td>
      <td>${num(x.delta)}</td><td>${num(x.mid)}</td><td>${pct(x.roc)}</td><td>${pct(x.cushion_pct)}</td>
      <td>${x.em_mult == null ? '–' : num(x.em_mult) + '×'}</td>
      <td class="${x.spread_pct == null || x.spread_pct > C.max_spread ? 'bad' : ''}">${pct(x.spread_pct)}</td>
      <td class="${x.oi < C.min_oi ? 'bad' : ''}">${x.oi.toLocaleString()}</td>
      <td>${x.iv == null ? '–' : pct(x.iv * 100, 0)}</td></tr>`;
  }).join('');
  return `<div class="ladder"><h3>Strikes at this expiry <span class="mute" style="font-weight:400">· ${wheel ? `greyed rows are above your $${num(r.own_price, r.own_price % 1 ? 2 : 0)} own price (you would pay more than you want to)` : `greyed rows are above the ${num(t)}Δ target (more premium, more assignment risk)`}</span></h3>
    <div class="tablewrap"><table><thead><tr><th class="l">Strike</th><th>Δ</th><th>Mid</th><th>Ann. ROC</th><th>Cushion</th><th>vs EM</th><th>Spread</th><th>OI</th><th>IV</th></tr></thead>
    <tbody>${rowsHTML}</tbody></table></div></div>`;
}

function ccTakeHTML(r, hist) {
  const under = r.spot_vs_cost < 0;
  return `Selling 1 contract (100 shares) collects about <b>$${r.premium.toFixed(0)}</b>. If the stock stays below <b>$${num(r.strike)}</b> you keep that and the shares
      (the premium also cushions a fall of ${pct(r.mid / r.spot * 100)}). If it finishes above, the shares are called away at $${num(r.strike)}: with the premium that is
      <b>$${num(r.strike + r.mid)}</b>, <b>${pct(r.called_pct)}</b> over your $${num(r.cost_basis)} cost${r.upside_pct > 0 ? `, and ${pct(r.upside_pct)} above today's $${num(r.spot)}` : ''}.
      Chance of that is roughly ${(r.delta * 100).toFixed(0)}%.
      ${under ? `<br>Spot is ${pct(-r.spot_vs_cost)} <b>under your cost</b>, so this is the lowest-risk strike that still sells at or above cost${r.floored ? ` (the ${num(r.target_delta)}Δ strike alone would be $${num(r.target_strike)}, a loss if called)` : ''}. Going lower pays more but locks in a loss if called.` : ''}
      ${hist}`;
}

function takeHTML(r, ivs) {
  const hist = `${ivs.length} day${ivs.length === 1 ? '' : 's'} of IV history${ivs.length ? `, range ${pct(Math.min(...ivs) * 100, 0)}–${pct(Math.max(...ivs) * 100, 0)}` : ''}.`;
  if (r.cost_basis != null) return ccTakeHTML(r, hist);
  if (r.own_price == null) {
    return `Selling 1 contract collects about <b>$${(r.premium).toFixed(0)}</b> on <b>$${r.collateral.toLocaleString()}</b> collateral; break-even <b>$${num(r.strike - r.mid)}</b>.
        The strike is ${pct(r.cushion_pct)} below spot${r.em_mult != null ? `, ${num(r.em_mult)}× the 1σ expected move (${r.em_mult < 1 ? 'inside' : 'outside'} it)` : ''}.
        ${hist}`;
  }
  return `Selling 1 contract collects about <b>$${r.premium.toFixed(0)}</b> on <b>$${r.collateral.toLocaleString()}</b> collateral.
        If assigned you own 100 shares at a net <b>$${num(r.net_cost)}</b> (strike minus premium), <b>${pct(r.net_below_spot_pct)}</b> below today's $${num(r.spot)}.
        Your own price is $${num(r.own_price)}${r.own_above_spot ? ', above today\'s price, so this uses the highest strike below spot' : ''}.
        ${r.delta != null ? `Assignment odds are roughly ${(r.delta * 100).toFixed(0)}%. ` : ''}IV Rank is ${r.ivr != null ? num(r.ivr, 0) : 'not available yet'} (information only on this tab). ${hist}`;
}

function showDetail() {
  const r = src().find(x => keyOf(x) === selected);
  if (!r) return;
  const sym = r.symbol, h = D.history[sym] || [];
  const mk = key => h.filter(p => p[key] != null).map(p => ({t: Date.parse(p.d), v: p[key]}));
  const ivs = h.map(p => p.iv).filter(v => v != null);
  $('#hist').hidden = false;
  $('#hist').innerHTML = `<div class="head">
      <span><b style="font-size:15px">${esc(sym)}</b> · ${esc(r.expiry)} (${r.dte}d) · $${num(r.strike, r.strike % 1 ? 2 : 0)} ${r.cost_basis != null ? 'call' : 'put'}${r.own_price != null ? ` · own price $${num(r.own_price, r.own_price % 1 ? 2 : 0)}` : ''}${r.cost_basis != null ? ` · cost basis $${num(r.cost_basis, r.cost_basis % 1 ? 2 : 0)}` : ''}
        · <b class="${r.passes ? 's-ok' : 'mute'}">${r.passes ? '● Worth a look' : 'Not on the shortlist'}</b></span>
      <button id="hx" aria-label="Close details" title="Close (Esc)">✕</button></div>
    <div class="reason ${r.passes ? 's-ok' : 'mute'}">${esc(reason(r))}</div>
    <div class="dgrid">
      <div>${checklist(r)}
        <div class="take">${takeHTML(r, ivs)}</div></div>
      <div>${ladderHTML(r) || '<p class="mute">No strike ladder saved for this run.</p>'}</div>
    </div>
    <div class="charts" style="margin-top:16px">
      ${chart('ATM IV vs 30-day realized vol', [{name: 'IV', pts: mk('iv')}, {name: 'RV', pts: mk('rv')}], v => (v * 100).toFixed(0) + '%')}
      ${r.own_price != null || r.cost_basis != null ? '' : chart(`Best annualized ROC at ≤${tgt(r).toFixed(2)}Δ`, [{name: 'ROC', pts: mk('roc')}], v => v.toFixed(0) + '%')}
    </div>`;
  $('#hx').onclick = closeDetail;
}
function select(key) {
  if (selected === key) return closeDetail();
  selected = key; showDetail(); render();
}
function closeDetail() { selected = null; $('#hist').hidden = true; render(); }

// ---- help drawer ------------------------------------------------------
function helpHTML() {
  return `<div class="row"><h2>How to read this page</h2><button id="helpx" aria-label="Close help">✕</button></div>
  <h4>What to look for</h4>
  <ol>
    <li><b>Start with "Top opportunities", then the ● rows.</b> They clear every check: liquid, IV elevated, pays at least your ROC hurdle, no earnings before expiry. Everything else is dimmed, and hovering its ● (or opening it) gives a one-line reason: Skip, Weak or Thin.</li>
    <li><b>Choose among them</b> by Ann. ROC, then check <b>vs EM</b> (more room to the strike) and <b>IV Rank</b> (is IV high for this stock, or is it always high?).</li>
    <li><b>Hover or click a row.</b> The cells that decided the ● light up green ✓, red ✗ or amber ?, and the panel at the bottom shows the numbers and the IV history.</li>
    <li><b>Before you trade:</b> confirm the earnings date yourself and check the live bid/ask. This page is a snapshot, and the mid is not a fill.</li>
  </ol>
  <h4>Metrics</h4>
  <dl>
    <dt>● Worth a look</dt><dd>Spread ≤ ${C.max_spread}% and open interest ≥ ${C.min_oi}; IV Rank ≥ ${C.ivr_min} (or IV/RV ≥ ${C.ivrv_min} until ${C.min_history} days of history exist); ann. ROC ≥ ${C.min_roc != null ? C.min_roc + '%' : 'your hurdle'}; no earnings before expiry. A shortlist, not a recommendation.</dd>
    <dt>Why a row is not ●</dt><dd><b>Skip</b>: earnings before expiry, or a thin market. <b>Weak</b>: IV is not elevated, so premium is ordinary for this stock. <b>Thin</b>: the setup is fine but the payout is under your hurdle (change it with <code>--min-roc</code>).</dd>
    <dt>Ann. ROC</dt><dd>Premium (mid) ÷ strike, annualized by days to expiry, checked against your hurdle. Compare it across names with similar expiries: very short expiries (a few days) look inflated because a small credit is annualized over days.</dd>
    <dt>Cushion</dt><dd>How far spot can fall before reaching the strike, as a % of spot.</dd>
    <dt>vs EM</dt><dd>The cushion in 1σ expected moves (from ATM IV). Around 0.8-0.9× is normal at ${C.delta.toFixed(2)}Δ. At 1× or more the strike sits outside the typical move; below 0.75× (amber) it is close.</dd>
    <dt>ATM IV</dt><dd>Implied volatility of the at-the-money option about 21 days out, the market's expected yearly move. Higher means fatter premium, but ask why (a selloff? an event?).</dd>
    <dt>IV Rank</dt><dd>Where today's IV sits between this stock's own low and high in the stored history (0-100). ${C.ivr_min}+ means rich for this stock. Shows – until ${C.min_history} days of history exist.</dd>
    <dt>IV/RV</dt><dd>ATM IV ÷ the last 30 days' realized vol. Above 1 means options price in more movement than the stock has delivered, which favors sellers.</dd>
    <dt>Spread</dt><dd>Bid-ask gap as a % of the mid. Small means a limit order near the mid will probably fill.</dd>
    <dt>OI</dt><dd>Open interest, the contracts outstanding. Low means a thin market.</dd>
    <dt>Earnings</dt><dd>A date before expiry means gap risk. ? means no earnings source is configured, so check manually.</dd>
    <dt>Δ, Mid, Strike</dt><dd>Δ is the put's delta (a rough assignment probability), shown as positive. Mid is (bid + ask) ÷ 2.</dd>
    <dt>IV trend</dt><dd>The last 60 days of ATM IV for that ticker.</dd>
    <dt>Strike ladder</dt><dd>Click a row to see the puts around its target delta at that expiry. Greyed rows are above the target: more premium, more assignment risk. Use it to see what going one or two strikes further out costs in ROC, or what a richer strike would pay.</dd>
    <dt>Custom delta (≤0.30Δ badge)</dt><dd>A ticker with its own target in <code>watchlist.txt</code> (for example <code>AMD 0.30</code>), for names you are happy to be assigned on. Compare ROC within a ticker, not across tickers with different targets.</dd>
    <dt>Wheel tab</dt><dd>For tickers with an own price (the price you would be happy to own the stock at): the strike at or just below it, at each expiry. <b>Net cost</b> is strike minus premium, your per-share cost if assigned. <b>Below spot</b> is how far under today's price that is. <b>Assign Δ</b> is roughly the chance of being assigned. The ● needs liquidity, the ROC hurdle and no earnings; IV richness is information only, since you are happy to own it anyway.</dd>
    <dt>Covered calls tab</dt><dd>For tickers with a cost basis (shares you hold): Friday and monthly (M) expiries, the call at or below ${C.cc_delta != null ? C.cc_delta.toFixed(2) : 'the target'}Δ (<b>Called Δ</b>, roughly the chance the shares are called away), <b>never at a strike below your cost basis</b>. <b>Room to strike</b> is how far the stock can rise first; <b>If called</b> is your gain over cost with the premium included; <b>Ann. yield</b> is premium ÷ share price, annualized.</dd>
    <dt>Spot above vs. below your cost</dt><dd>Above cost, the delta rule picks the strike and any call-away is a gain. Under cost, the strike is lifted to your cost (<b>floor</b> tag), so it sits further out and pays less. Selling lower collects more but locks in a loss if called; the strike ladder shows what each step costs.</dd>
    <dt>Where own prices come from</dt><dd>An "Own price" column in your published Google Sheet tab (<code>WATCHLIST_URL</code> in .env), or <code>AMD @480</code> in watchlist.txt. Cost basis works the same way: a "Cost basis" column, or <code>AMD $465</code>.</dd>
  </dl>
  <h4>Controls</h4>
  <p><b>Rows per ticker</b> shrinks the list: "Best ROC" tends to pick the shortest expiry; "Nearest 14 DTE" keeps the one closest to two weeks. Shortlist rows win either way.</p>
  <p>Click a column header to sort (click ● to go back to shortlist-first). Click a selected row again to close its details.</p>
  <p>Keys: <b>?</b> opens this help, <b>Esc</b> closes it or the details panel.</p>`;
}
function toggleHelp(force) {
  const open = force === undefined ? $('#help').hidden : force;
  if (open && !$('#help').innerHTML) $('#help').innerHTML = helpHTML();
  $('#help').hidden = !open; $('#scrim').hidden = !open;
  if (open) { $('#helpx').onclick = () => toggleHelp(false); $('#helpx').focus(); } else $('#helpbtn').focus();
}

// ---- wiring -----------------------------------------------------------
function csv() {
  if (lens === 'prices' || lens === 'charts' || lens === 'market') {
    if (lens !== 'prices') return;
    const body = ['symbol,price,day_pct,since_first_pct,low,high,days'].concat(priceRows().map(r => [r.sym, r.last, r.day, r.since, r.lo, r.hi, r.h.length].map(v => v == null ? '' : typeof v === 'number' ? +v.toFixed(4) : v).join(',')));
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([body.join('\n')], {type: 'text/csv'}));
    a.download = 'prices-' + D.generated.slice(0, 10) + '.csv';
    a.click();
    return;
  }
  const keys = lens === 'cc'
    ? ['symbol','spot','cost_basis','spot_vs_cost','expiry','dte','strike','delta','bid','ask','mid','premium','roc','upside_pct','called_pct','em_mult','ref_iv','ivr','spread_pct','oi','earnings','passes']
    : lens === 'wheel'
    ? ['symbol','spot','own_price','spot_vs_own','expiry','dte','strike','delta','bid','ask','mid','premium','collateral','roc','net_cost','net_below_spot_pct','ref_iv','ivr','spread_pct','oi','earnings','passes']
    : ['symbol','spot','expiry','dte','strike','delta','bid','ask','mid','premium','collateral','roc','cushion_pct','em_mult','ref_iv','ivr','iv_rv','spread_pct','oi','earnings','passes'];
  const rows = filtered().sort((a, b) => b.roc - a.roc);
  const body = [keys.join(',')].concat(rows.map(r => keys.map(k => r[k] == null ? '' : (typeof r[k] === 'number' ? +r[k].toFixed(4) : r[k])).join(',')));
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([body.join('\n')], {type: 'text/csv'}));
  a.download = (lens === 'income' ? 'csp' : lens) + '-' + D.generated.slice(0, 10) + '.csv';
  a.click();
}

function setLegend() {
  const hurdle = C.min_roc != null ? C.min_roc + '%' : 'your hurdle';
  const ccHurdle = C.min_cc_yield != null ? C.min_cc_yield + '%' : 'your hurdle';
  $('#legend').innerHTML = (lens === 'cc'
    ? `<b>●</b> = worth a look for a covered call: liquid (spread ≤ ${C.max_spread}% of mid or ≤ $${C.cc_max_spread_abs != null ? C.cc_max_spread_abs.toFixed(2) : '0.10'}), pays at least ${ccHurdle} annualized on the share price, no earnings before expiry. IV richness is not required, since you hold the shares anyway. Strikes are at most ${C.cc_delta != null ? C.cc_delta.toFixed(2) : ''}Δ (<b>Called Δ</b> is roughly the chance of being called away) and <b>never below your cost basis</b>; a <b>floor</b> tag means the cost basis pushed the strike up. <b>If called</b> is your gain on the shares, premium included.`
    : lens === 'wheel'
    ? `<b>●</b> = worth a look for the wheel: liquid, pays at least ${hurdle} annualized, no earnings before expiry. IV richness is not required, since you are happy to own the stock at your price. <b>Net cost</b> is strike minus premium; <b>Assign Δ</b> is roughly the chance of being assigned. <b>Spot vs own</b> turns red when the stock is at or below your own price: the strike then follows spot, so update the price.`
    : `<b>●</b> = worth a look: liquid, IV elevated, pays at least ${hurdle} annualized, no earnings before expiry.`) +
    ` Hover a row's ● for its reason, or click the row to see which cells decided it. Press <b>?</b> (or the button at the top) for what each column means and what to look for.`;
}

function switchLens(l) {
  // the tab lives in the URL hash so a refresh (or run-to-run nav) stays on it
  try { history.replaceState(null, '', l === 'income' ? location.pathname + location.search : '#' + l); } catch (e) {}
  const pr = ['prices', 'charts', 'market'].includes(l);
  ['#top3', '.bar', '.tablewrap.main', '#legend'].forEach(q => { document.querySelector(q).hidden = pr; });
  $('#prices').hidden = $('#live').hidden = l !== 'prices'; $('#charts').hidden = l !== 'charts'; $('#market').hidden = l !== 'market';
  if (pr) {
    lens = l; selected = null; $('#hist').hidden = true;
    document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.lens === l));
    if (l === 'prices') { tvMount('live', 'live'); renderPrices(); } else tvMount(l, l);
    return;
  }
  lens = l; cols = l === 'wheel' ? wheelCols : l === 'cc' ? ccCols : incomeCols;
  sort = {k: 'passes', dir: -1}; selected = null; $('#hist').hidden = true;
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.lens === l));
  fillExp(); setLegend(); render();
}

// ---- history navigation (manifest.js lists the saved sessions, newest first) ----
let navOlder = null, navNewer = null;
const fmtDay = d => new Date(d + 'T12:00:00').toLocaleDateString(undefined, {weekday: 'short', month: 'short', day: 'numeric', year: 'numeric'});
const fmtShort = d => new Date(d + 'T12:00:00').toLocaleDateString(undefined, {weekday: 'short', month: 'short', day: 'numeric'});
const runHref = (runs, d) => ROOT + (d === runs[0].d ? 'index.html' : 'runs/' + d + '.html') + (lens === 'income' ? '' : '#' + lens);
function loadNav(sess) {
  const s = document.createElement('script');
  s.src = ROOT + 'manifest.js';
  s.onload = () => { if (window.RUNS && window.RUNS.length) buildNav(window.RUNS, sess); };
  document.head.appendChild(s);   // a missing manifest just leaves the nav hidden
}
function buildNav(runs, sess) {
  const i = runs.findIndex(r => r.d === sess);
  const go = r => { location.href = runHref(runs, r.d); };
  navOlder = runs[i + 1] || null;           // i = -1 (unsaved preview newer than every snapshot): older is runs[0]
  navNewer = i > 0 ? runs[i - 1] : null;
  const groups = {};
  runs.forEach(r => (groups[r.d.slice(0, 7)] = groups[r.d.slice(0, 7)] || []).push(r));
  const opts = Object.keys(groups).map(m =>
    `<optgroup label="${new Date(m + '-15T12:00:00').toLocaleDateString(undefined, {month: 'long', year: 'numeric'})}">` +
    groups[m].map(r => `<option value="${r.d}"${r.d === sess ? ' selected' : ''}>${fmtDay(r.d)} · ${r.n} rows · ${r.pass} ●${r.phase && r.phase !== 'close' ? ' · ' + (r.phase === 'off' ? 'off-hours' : r.phase) : ''}</option>`).join('') +
    '</optgroup>').join('');
  const nav = $('#nav');
  nav.innerHTML = (i > 0 ? `<span class="mute">Viewing the snapshot from ${fmtDay(sess)}</span>` : '') +
    (i === 0 && D.recorded !== false ? '' : `<a href="${ROOT}index.html">Latest</a>`) +
    `<button id="nv-old" ${navOlder ? '' : 'disabled'} title="Older run  ([)" aria-label="Older run">←</button>` +
    `<select id="nv-pick" aria-label="Saved run date">${i < 0 ? '<option selected>Unsaved preview</option>' : ''}${opts}</select>` +
    `<button id="nv-new" ${navNewer ? '' : 'disabled'} title="Newer run  (])" aria-label="Newer run">→</button>`;
  nav.hidden = false;
  $('#nv-old').onclick = () => navOlder && go(navOlder);
  $('#nv-new').onclick = () => navNewer && go(navNewer);
  // closed picker shows just the date; the open list shows the full detail
  const pick = $('#nv-pick'), setText = long => [...pick.options].forEach(o => { if (o.dataset.s) o.textContent = long ? o.dataset.l : o.dataset.s; });
  [...pick.options].forEach(o => { if (o.value && o.value !== 'Unsaved preview' && /^\d{4}-/.test(o.value)) { o.dataset.l = o.textContent; o.dataset.s = fmtShort(o.value); } });
  setText(false);
  pick.addEventListener('mousedown', () => setText(true));
  pick.addEventListener('focus', () => setText(true));
  pick.addEventListener('blur', () => setText(false));
  pick.onchange = e => { setText(false); go({d: e.target.value}); };
}

function fillExp() {
  const q = $('#f-q'), qv = q.value;
  q.innerHTML = '<option value="">All</option>' + [...new Set(src().map(r => r.symbol))].sort().map(t => `<option>${esc(t)}</option>`).join('');
  q.value = qv;
  $('#f-exp').innerHTML = '<option value="">All</option>' + [...new Set(src().map(r => r.expiry))].sort().map(e => `<option>${e}</option>`).join('');
}

function init() {
  const nCustom = Object.keys(C.custom_delta || {}).length;
  const live = D.recorded !== false && (D.phase === 'intraday' || D.phase === 'off');
  const phaseNote = live ? (D.phase === 'intraday' ? ' (intraday)' : ' (off-hours)') : '';
  $('#meta').title = live ? (D.phase === 'intraday' ? 'Intraday snapshot: quotes are mid-session, and the close run replaces it.' : 'Taken outside market hours: quotes may be stale until a session run replaces it.') : '';
  const updatedLocal = () => D.generated_at ? new Date(D.generated_at).toLocaleString([], {month:'short', day:'numeric', year:'numeric', hour:'numeric', minute:'2-digit', timeZoneName:'short'}) : D.generated;
  $('#meta').textContent = `Updated ${updatedLocal()}${phaseNote} · short put ≤ ${C.delta.toFixed(2)}Δ${nCustom ? ` (${nCustom} ticker${nCustom === 1 ? '' : 's'} custom)` : ''} · ${C.dte_min}–${C.dte_max} DTE${C.min_roc != null ? ` · hurdle ${C.min_roc}% ann.` : ''} · ${new Set(D.rows.map(r => r.symbol)).size} tickers${D.elapsed_s != null ? ` · ran in ${D.elapsed_s < 90 ? Math.round(D.elapsed_s) + 's' : (D.elapsed_s / 60).toFixed(1) + ' min'}${D.only ? ' (' + D.only + ' only)' : ''}` : ''}`;
  (D.wheel || []).forEach(r => { r.spot_vs_own = r.own_price > 0 ? (r.spot / r.own_price - 1) * 100 : null; });
  const b = [], urgent = [], under = [], below = [];
  const ageH = D.generated_at ? (Date.now() - new Date(D.generated_at)) / 36e5 : null;
  const weekend = [0, 6].includes(new Date().getDay());
  if (ROOT === '' && ageH != null && ageH > 26 && !(weekend && ageH < 80))
    urgent.push(`This page is ${ageH < 48 ? Math.round(ageH) + ' hours' : Math.round(ageH / 24) + ' days'} old. Prices and strikes are from the last run, not today.`);
  const spots = {};
  (D.wheel || []).forEach(r => { spots[r.symbol] = r; });
  Object.values(spots).filter(r => r.spot_vs_own != null && r.spot_vs_own <= 0).sort((a, b) => a.spot_vs_own - b.spot_vs_own).forEach(r => { below.push(r.symbol);
    b.push(`${r.symbol} was $${num(r.spot)} at the last run, ${pct(-r.spot_vs_own)} below your $${num(r.own_price, r.own_price % 1 ? 2 : 0)} own price. Wheel strikes now follow spot, so revisit that price in the sheet.`); });
  const held = {};
  (D.cc || []).forEach(r => { held[r.symbol] = r; });
  Object.values(held).filter(r => r.spot_vs_cost < 0).sort((a, b) => a.spot_vs_cost - b.spot_vs_cost).forEach(r => { under.push(r.symbol);
    b.push(`${r.symbol} was $${num(r.spot)} at the last run, ${pct(-r.spot_vs_cost)} under your $${num(r.cost_basis, r.cost_basis % 1 ? 2 : 0)} cost basis. Covered calls stay at or above your cost, so their strikes sit further out and pay less.`); });
  if (D.subset) b.push(`Partial refresh: only ${D.subset.join(', ')} updated at ${new Date(D.generated_at).toLocaleString([], {month:'short', day:'numeric', hour:'numeric', minute:'2-digit'})}; other tickers are from earlier runs this session.`);
  if (D.only && D.leg_times && D.leg_times.puts && D.leg_times.cc) {
    const fmt = x => new Date(x).toLocaleString([], {month:'short', day:'numeric', hour:'numeric', minute:'2-digit'});
    b.push(`Partial refresh: Income and Wheel as of ${fmt(D.leg_times.puts)}, Covered calls as of ${fmt(D.leg_times.cc)}.`);
  }
  ((D.watchlist && D.watchlist.notes) || []).forEach(n => b.push(n));
  if (D.mock) b.push('Mock data: synthetic numbers for testing the page, not market data.');
  const sess = D.session || D.generated.slice(0, 10);
  if (D.recorded === false) b.push(D.phase ? `Preview, not saved: the ${sess} session already has a better snapshot, or the market is closed. IV history was not updated.` : 'IV history was not updated for this run.');
  if (!D.earnings_source) b.push('No earnings source configured, so the Earnings column shows "?". Add a Finnhub key to enable it.');
  // Only the stale-page warning stays always visible; routine notices fold into one expandable line.
  const other = b.length - under.length - below.length;
  const sum = [under.length ? `${under.length} under cost basis (${under.join(', ')})` : '',
               below.length ? `${below.length} below own price (${below.join(', ')})` : '',
               other ? `${other} other` : ''].filter(Boolean).join(' · ');
  $('#banners').innerHTML = urgent.map(t => `<div class="banner">${esc(t)}</div>`).join('') +
    (b.length ? `<details class="notices"><summary>${b.length} notice${b.length === 1 ? '' : 's'} · ${esc(sum)}</summary>${b.map(t => `<div class="note">${esc(t)}</div>`).join('')}</details>` : '');
  fillExp();
  $('#top3').addEventListener('click', e => { const c = e.target.closest('.card'); if (c) select(c.dataset.key); });
  const nOwn = Object.keys(C.own_price || {}).length;
  $('#tab-wheel').textContent = 'Wheel · own price' + (nOwn ? ` (${nOwn})` : '');
  const nCost = Object.keys(C.cost_basis || {}).length;
  $('#tab-cc').textContent = 'Covered calls · cost basis' + (nCost ? ` (${nCost})` : '');
  $('#tabs').addEventListener('click', e => { const t = e.target.closest('button[data-lens]'); if (t && t.dataset.lens !== lens) switchLens(t.dataset.lens); });
  if (D.watchlist && D.watchlist.source) $('#meta').textContent += ` · watchlist: ${D.watchlist.source}`;
  setLegend();
  loadNav(sess);
  if (D.errors.length) { $('#errs').hidden = false; $('#errlist').innerHTML = D.errors.map(e => `<li>${esc(e)}</li>`).join(''); }

  document.querySelectorAll('.bar input, .bar select').forEach(el => el.addEventListener('input', render));
  $('#csv').addEventListener('click', csv);
  $('#helpbtn').addEventListener('click', () => toggleHelp());
  $('#scrim').addEventListener('click', () => toggleHelp(false));
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { if (!$('#help').hidden) toggleHelp(false); else if (selected) closeDetail(); }
    else if ((e.key === '[' || e.key === ']') && !/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) {
      const r = e.key === '[' ? navOlder : navNewer;
      if (r) location.href = runHref(window.RUNS, r.d);
    }
    else if (e.key === '?' && !/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) toggleHelp();
  });
  $('#tbl thead').addEventListener('click', e => {
    const th = e.target.closest('th'); if (!th || th.classList.contains('nosort')) return;
    const k = th.dataset.k;
    sort = {k, dir: sort.k === k ? -sort.dir : (k === 'symbol' || k === 'expiry' ? 1 : -1)};
    render();
  });
  $('#tbl tbody').addEventListener('click', e => { const tr = e.target.closest('tr[data-key]'); if (tr) select(tr.dataset.key); });
  render();
  const want = location.hash.slice(1);
  if (['wheel', 'cc', 'prices', 'charts', 'market'].includes(want)) switchLens(want);
}
init();
</script>
</body>
</html>
